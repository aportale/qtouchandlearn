<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels.
        viewport-fit=cover lets the page extend under the notch and the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>

    <!-- Run as a full screen web app without Safari's bars when added to the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Touch and Learn">
    <!-- Tint the browser bars like the app background, so that they blend in. -->
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">

    <title>touchandlearn</title>
    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars.
         The fixed position and overscroll-behavior stop the rubber band scrolling
         that would otherwise move the page and bring Safari's bars back. */
      html, body {
        padding: 0; margin: 0; overflow: hidden;
        position: fixed; inset: 0;
        width: 100%; height: 100%; height: 100dvh;
        background: #000; color: #fff;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* Keep the app inside the safe area, away from the notch, the rounded corners
         and the home indicator. The black page background fills the rest. */
      #screen {
        position: absolute;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: touchandlearn</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">
        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                ui.style.display = 'block';
            }

            // touchandlearn.js and touchandlearn.wasm must come from the same build, because the
            // JavaScript refers to addresses in the wasm memory, for example in ASM_CONSTS. Safari
            // may keep one of the two files from an earlier build in its cache, and use it without
            // asking the server. So revalidate the wasm file on each load, which costs a small
            // request if the file did not change, and load the JavaScript under a version from the
            // wasm file. That way, the browser can keep both cached, but never mixes two builds.
            const loadModule = async () => {
                const response = await fetch('touchandlearn.wasm', { cache: 'no-cache' });
                if (!response.ok)
                    throw new Error(`Could not fetch touchandlearn.wasm: ${response.status}`);
                const version = response.headers.get('ETag')
                    ?? response.headers.get('Last-Modified') ?? String(Date.now());
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `touchandlearn.js?v=${encodeURIComponent(version)}`;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Could not load touchandlearn.js'));
                    document.body.appendChild(script);
                });
                // Compiling while downloading needs the MIME type application/wasm. Not all web
                // servers send it.
                const contentType = response.headers.get('Content-Type') ?? '';
                return contentType.startsWith('application/wasm')
                    ? WebAssembly.compileStreaming(response)
                    : WebAssembly.compile(await response.arrayBuffer());
            };

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const module = await loadModule();
                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => showUi(screen),
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.touchandlearn_entry,
                        containerElements: [screen],
                        module: module,
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
